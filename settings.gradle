pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'minecraft_smoothlight'

include '1.20.1:fabric'
include '1.20.1:forge'
include '1.20.1:neoforge'
include '1.21.1:fabric'
include '1.21.1:forge'
include '1.21.1:neoforge'
